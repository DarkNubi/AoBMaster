[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aobmaster"
version = "2.0.0"
description = "AoBMaster v2.0: deterministic, address-anchored AoB signature synthesis with temporal analysis and signature management for PE x64 binaries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "AoBMaster" }]
dependencies = [
  "iced-x86>=1.21.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]
performance = [
  "numpy>=1.24.0",
]

[project.scripts]
aobmaster = "aobmaster.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

